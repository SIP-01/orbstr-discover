name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        # The test suite needs the ws devDependency, and npm ci omits dev
        # dependencies in a CI environment unless they are asked for.
        run: npm ci --include=dev
      - name: Run tests
        run: npm test
